name: 问题反馈
description: 报告计算、界面或安装问题
labels: []
body:
  - type: markdown
    attributes:
      value: 请勿填写真实私人事项、备注或凭据。计算问题可用“测试事件”替代名称。
  - type: input
    id: versions
    attributes:
      label: 环境与版本
      description: 扩展版本、macOS、Raycast、Node.js 版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 计算问题请包含今天、目标日期、时区、计算模式及是否计入两端。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可附脱敏截图、错误信息及假期日历显示的数据状态。
